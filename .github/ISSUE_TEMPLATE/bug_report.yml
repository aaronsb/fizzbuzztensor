name: Bug report
description: Output is wrong, a script crashes, or a figure renders incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output or traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Python 3.12, numpy 2.1, matplotlib 3.9, Linux
