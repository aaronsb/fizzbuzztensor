name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -v

  visualize:
    name: Render visualizations
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Run every entry point
        run: |
          uv run python fizzbuzz.py
          uv run python fizzbuzz_compact.py
          uv run python fizzbuzz_batched.py
          uv run python dimensional_representations.py
      - name: Render figures headlessly
        run: |
          uv run python visualize.py
          uv run python visualize_compact.py
          uv run python visualize_batched.py
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            *.png
            docs/images/*.png
          if-no-files-found: error

  ci:
    name: CI
    if: always()
    needs: [lint, test, visualize]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1 || exit 0
